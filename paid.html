<body class="bg-stone-50 text-stone-800 font-sans min-h-screen pb-16">
    <nav class="relative p-4 flex justify-between items-center border-b sticky top-0 bg-white/90 backdrop-blur-md z-40">
        <a href="index.html" class="text-xl font-bold text-amber-800 tracking-wider">Poponew甜點</a>
        <a href="order-search.html" class="text-sm font-medium text-amber-800 underline underline-offset-2">訂單查詢</a>
        <div class="absolute top-[calc(100%+10px)] right-4 flex items-center bg-white/95 backdrop-blur-md rounded-xl p-1 border border-stone-200 shadow-md z-30">
            <button type="button" onclick="changeFontSize(-1)" title="縮小字型" class="w-8 h-7 flex items-center justify-center text-xs font-bold text-stone-600 hover:bg-stone-100 hover:text-amber-800 rounded-lg transition active:scale-95">A-</button>
            <button type="button" onclick="resetFontSize()" title="重設字型" class="px-2 h-7 flex items-center justify-center text-xs font-medium text-stone-400 hover:text-amber-800 transition">預設</button>
            <button type="button" onclick="changeFontSize(1)" title="放大字型" class="w-8 h-7 flex items-center justify-center text-sm font-bold text-stone-700 hover:bg-stone-100 hover:text-amber-800 rounded-lg transition active:scale-95">A+</button>
        </div>
    </nav>

    <div class="font-zoom max-w-md mx-auto px-4 my-8">
        <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
            <h1 class="text-2xl font-bold text-amber-800 text-center">通知已匯款</h1>
            <p class="text-stone-500 text-sm text-center mt-2 leading-relaxed">這只是通知店家「我已匯款」，還要等對完帳才算出貨。貨到付款不用填這頁。</p>

            <div id="done-box" class="hidden mt-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm leading-relaxed">
                已通知店家，狀態會標成「客人已回報匯款」。對完銀行後才會改成已對帳。
            </div>
            <p id="done-repeat" class="hidden mt-3 text-xs text-stone-500 text-center">這筆訂單先前已回報過，不必再送一次。</p>

            <div id="error-box" class="hidden mt-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm leading-relaxed">
                <p>通知沒有送出成功，店家可能還沒收到。請再試一次，或透過 <a href="https://line.me/R/ti/p/@534euhut" target="_blank" rel="noopener noreferrer" class="font-semibold text-amber-800 underline underline-offset-2">官方 LINE @534euhut</a> 聯繫我們。</p>
            </div>

            <form id="paid-form" class="mt-6 space-y-4" onsubmit="submitPaid(event)">
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">訂單編號</label>
                    <input type="text" id="order-id" required readonly class="w-full h-11 px-4 border border-stone-300 rounded-xl bg-stone-50 text-stone-700">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">訂購手機號碼</label>
                    <input type="tel" id="phone" required pattern="^09\d{8}$" placeholder="例如 0912345678" class="w-full h-11 px-4 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">匯款帳號末五碼</label>
                    <input type="text" id="last-five" required pattern="^\d{5}$" maxlength="5" inputmode="numeric" placeholder="例如 12345" class="w-full h-11 px-4 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <p class="text-[11px] text-stone-400 mt-1">若下單時填錯，請在這裡改成正確的末五碼。</p>
                </div>
                <button type="submit" id="paid-btn" class="w-full h-12 bg-amber-700 hover:bg-amber-800 text-white font-bold rounded-xl shadow-md active:scale-95">我已匯款，通知店家</button>
            </form>

            <p id="missing-box" class="hidden mt-6 text-sm text-stone-600 leading-relaxed text-center">
                找不到訂單編號。請從訂購確認信的按鈕進來，或先到<a href="order-search.html" class="font-semibold text-amber-700 underline underline-offset-2">訂單查詢</a>再按通知。
            </p>
        </div>
    </div>

    <script>
        var SHEET_WEB_APP = "https://script.google.com/macros/s/AKfycbxcCForIYEf0QVxp1eZnmihcVy3V61O9fRLGyrrNBv_v1i5XD8K6ZxX7FJ5CZltvFSd/exec";
        var params = new URLSearchParams(location.search);
        var orderId = (params.get("order") || "").trim();
        var phone = (params.get("phone") || "").trim();
        var lastFive = (params.get("five") || "").trim();
        var form = document.getElementById("paid-form");
        var doneBox = document.getElementById("done-box");
        var doneRepeat = document.getElementById("done-repeat");
        var missingBox = document.getElementById("missing-box");
        var errorBox = document.getElementById("error-box");

        function storageKey(id) { return "poponew_paid_" + id; }
        function showDone(repeat) {
            form.classList.add("hidden");
            missingBox.classList.add("hidden");
            errorBox.classList.add("hidden");
            doneBox.classList.remove("hidden");
            if (repeat) doneRepeat.classList.remove("hidden");
        }

        if (!orderId) {
            form.classList.add("hidden");
            missingBox.classList.remove("hidden");
        } else {
            document.getElementById("order-id").value = orderId;
            document.getElementById("phone").value = phone;
            document.getElementById("last-five").value = lastFive;
            if (localStorage.getItem(storageKey(orderId))) showDone(true);
        }


        function isPaidBackendSuccess(respText) {
            var rawText = String(respText || "").replace(/^﻿/, "").trim();
            if (!rawText) return false;
            if (rawText === "成功") return true;
            try {
                var data = JSON.parse(rawText);
                if (!data || typeof data !== "object") return false;
                if (data.ok === true || data.success === true) return true;
                var result = String(data.result || data.status || "").toLowerCase();
                if (result === "success" || result === "ok" || result === "true" || result === "成功") return true;
            } catch (err) {}
            return false;
        }

        function resetPaidButton() {
            var btn = document.getElementById("paid-btn");
            btn.disabled = false;
            btn.innerText = "再試一次，通知店家";
        }

        function showPaidError() {
            form.classList.remove("hidden");
            doneBox.classList.add("hidden");
            doneRepeat.classList.add("hidden");
            errorBox.classList.remove("hidden");
            resetPaidButton();
        }

        function submitPaid(event) {
            event.preventDefault();
            var id = document.getElementById("order-id").value.trim();
            var tel = document.getElementById("phone").value.trim();
            var five = document.getElementById("last-five").value.trim();
            if (!/^09\d{8}$/.test(tel)) {
                alert("請輸入正確的台灣手機號碼（例如：0912345678）");
                return;
            }
            if (!/^\d{5}$/.test(five)) {
                alert("請輸入 5 碼數字的匯款末五碼");
                return;
            }
            var btn = document.getElementById("paid-btn");
            btn.disabled = true;
            btn.innerText = "送出中...";
            errorBox.classList.add("hidden");
            var finished = false;
            var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
            var timeoutId = setTimeout(function() {
                if (finished) return;
                finished = true;
                if (controller) controller.abort();
                showPaidError();
            }, 30000);
            var fetchOpts = {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "paid_notice",
                    order_id: id,
                    customer_phone: tel,
                    account_last_five: five
                })
            };
            if (controller) fetchOpts.signal = controller.signal;
            fetch(SHEET_WEB_APP, fetchOpts)
            .then(function(res) {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.text();
            })
            .then(function(respText) {
                if (finished) return;
                finished = true;
                clearTimeout(timeoutId);
                if (isPaidBackendSuccess(respText)) {
                    localStorage.setItem(storageKey(id), String(Date.now()));
                    errorBox.classList.add("hidden");
                    showDone(false);
                } else {
                    showPaidError();
                }
            })
            .catch(function() {
                if (finished) return;
                finished = true;
                clearTimeout(timeoutId);
                showPaidError();
            });
        }
        let currentFontSize = parseInt(localStorage.getItem("poponew_font_size")) || 16;
        applyFontSize(currentFontSize);
        function changeFontSize(delta) {
            currentFontSize = Math.min(Math.max(currentFontSize + delta * 2, 14), 22);
            applyFontSize(currentFontSize);
        }
        function resetFontSize() {
            currentFontSize = 16;
            applyFontSize(currentFontSize);
        }
        function applyFontSize(size) {
            document.documentElement.style.fontSize = "16px";
            localStorage.setItem("poponew_font_size", size);
            var scale = (parseInt(size, 10) || 16) / 16;
            document.querySelectorAll(".font-zoom").forEach(function(el) { el.style.zoom = scale === 1 ? "" : String(scale); });
        }
    </script>
</body>
