<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MMGS0E58FW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-MMGS0E58FW');
    </script>
    <title>通知已匯款 - Poponew手做甜點</title>
    <meta name="description" content="通知 Poponew手做甜點您已完成匯款。">
    <link rel="stylesheet" href="css/tailwind.css">
    <style>
        @font-face {
            font-family: "poponew";
            src: url("fonts/poponew.woff2") format("woff2"),
                 url("fonts/poponew.ttf") format("truetype");
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        h1, nav a { font-family: "poponew", sans-serif !important; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen pb-16">
    <nav class="p-4 flex justify-between items-center border-b sticky top-0 bg-white/90 backdrop-blur-md z-40">
        <a href="index.html" class="text-xl font-bold text-amber-800 tracking-wider">Poponew甜點</a>
        <a href="order-search.html" class="text-sm font-medium text-amber-800 underline underline-offset-2">訂單查詢</a>
    </nav>

    <div class="max-w-md mx-auto px-4 my-8">
        <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
            <h1 class="text-2xl font-bold text-amber-800 text-center">通知已匯款</h1>
            <p class="text-stone-500 text-sm text-center mt-2 leading-relaxed">這只是通知店家「我已匯款」，還要等對完帳才算出貨。貨到付款不用填這頁。</p>

            <div id="done-box" class="hidden mt-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm leading-relaxed">
                已通知店家，狀態會標成「客人已回報匯款」。對完銀行後才會改成已對帳。
            </div>
            <p id="done-repeat" class="hidden mt-3 text-xs text-stone-500 text-center">這筆訂單先前已回報過，不必再送一次。</p>

            <form id="paid-form" class="mt-6 space-y-4" onsubmit="submitPaid(event)">
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">訂單編號</label>
                    <input type="text" id="order-id" required readonly class="w-full h-11 px-4 border border-stone-300 rounded-xl bg-stone-50 text-stone-700">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">訂購手機號碼</label>
                    <input type="tel" id="phone" required pattern="^09\d{8}$" placeholder="例如 0912345678" class="w-full h-11 px-4 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">匯款帳號末五碼</label>
                    <input type="text" id="last-five" required pattern="^\d{5}$" maxlength="5" inputmode="numeric" placeholder="例如 12345" class="w-full h-11 px-4 border border-stone-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <p class="text-[11px] text-stone-400 mt-1">若下單時填錯，請在這裡改成正確的末五碼。</p>
                </div>
                <button type="submit" id="paid-btn" class="w-full h-12 bg-amber-700 hover:bg-amber-800 text-white font-bold rounded-xl shadow-md active:scale-95">我已匯款，通知店家</button>
            </form>

            <p id="missing-box" class="hidden mt-6 text-sm text-stone-600 leading-relaxed text-center">
                找不到訂單編號。請從訂購確認信的按鈕進來，或先到<a href="order-search.html" class="font-semibold text-amber-700 underline underline-offset-2">訂單查詢</a>再按通知。
            </p>
        </div>
    </div>

    <script>
        var SHEET_WEB_APP = "https://script.google.com/macros/s/AKfycbxcCForIYEf0QVxp1eZnmihcVy3V61O9fRLGyrrNBv_v1i5XD8K6ZxX7FJ5CZltvFSd/exec";
        var params = new URLSearchParams(location.search);
        var orderId = (params.get("order") || "").trim();
        var phone = (params.get("phone") || "").trim();
        var lastFive = (params.get("five") || "").trim();
        var form = document.getElementById("paid-form");
        var doneBox = document.getElementById("done-box");
        var doneRepeat = document.getElementById("done-repeat");
        var missingBox = document.getElementById("missing-box");

        function storageKey(id) { return "poponew_paid_" + id; }
        function showDone(repeat) {
            form.classList.add("hidden");
            missingBox.classList.add("hidden");
            doneBox.classList.remove("hidden");
            if (repeat) doneRepeat.classList.remove("hidden");
        }

        if (!orderId) {
            form.classList.add("hidden");
            missingBox.classList.remove("hidden");
        } else {
            document.getElementById("order-id").value = orderId;
            document.getElementById("phone").value = phone;
            document.getElementById("last-five").value = lastFive;
            if (localStorage.getItem(storageKey(orderId))) showDone(true);
        }

        function submitPaid(event) {
            event.preventDefault();
            var id = document.getElementById("order-id").value.trim();
            var tel = document.getElementById("phone").value.trim();
            var five = document.getElementById("last-five").value.trim();
            if (!/^09\d{8}$/.test(tel)) {
                alert("請輸入正確的台灣手機號碼（例如：0912345678）");
                return;
            }
            if (!/^\d{5}$/.test(five)) {
                alert("請輸入 5 碼數字的匯款末五碼");
                return;
            }
            var btn = document.getElementById("paid-btn");
            btn.disabled = true;
            btn.innerText = "送出中...";
            fetch(SHEET_WEB_APP, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "paid_notice",
                    order_id: id,
                    customer_phone: tel,
                    account_last_five: five
                })
            }).then(function() {
                localStorage.setItem(storageKey(id), String(Date.now()));
                showDone(false);
            }).catch(function() {
                localStorage.setItem(storageKey(id), String(Date.now()));
                showDone(false);
            });
        }
    </script>
</body>
</html>
